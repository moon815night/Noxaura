<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>夜的光晕</title>
  
  <!-- CSS 资源引入 -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dict.css">
</head>
<body>

<div class="chat-app">
  <!-- 二、顶部栏 -->
  <header class="top-bar">
    <div class="top-left">
      <!-- 缩小后的返回箭头图标 -->
      <button class="btn-back" aria-label="返回">
        <svg width="14" height="16" viewBox="0 0 12 14" fill="none" stroke="#2e1f19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2L3 7l6 5" />
        </svg>
      </button>
      <div class="contact-info">
        <div class="contact-name">顾时夜</div>
        <div class="status-bar">
          <!-- 横着的游戏机 SVG 图标 -->
          <svg class="console-icon-svg" width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="#2e1f19" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
            <!-- 游戏机外框 -->
            <rect x="0.8" y="0.8" width="14.4" height="8.4" rx="2" />
            <!-- 左侧十字键横竖线条 -->
            <line x1="2.8" y1="5" x2="5.2" y2="5" />
            <line x1="4" y1="3.8" x2="4" y2="6.2" />
            <!-- 右侧按键 -->
            <circle cx="11.5" cy="4.2" r="0.6" fill="#2e1f19" stroke="none" />
            <circle cx="13.2" cy="5.8" r="0.6" fill="#2e1f19" stroke="none" />
          </svg>
          <span>在线</span>
        </div>
      </div>
    </div>
    <div class="top-right">
      <!-- 月亮图标 -->
      <button class="icon-btn" aria-label="月亮">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2e1f19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#eef8f0"/>
        </svg>
      </button>
      <!-- 设置键 -->
      <button class="icon-btn" id="btn-settings" aria-label="设置">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2e1f19" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 三、聊天区 -->
  <main class="chat-content" id="chat-content">
    <!-- 对方消息示例 -->
    <div class="msg-row opponent">
      <div class="avatar"></div>
      <div class="bubble-wrapper">
        <div class="bubble">你在做什么？</div>
        <svg class="bubble-svg">
          <path d="" />
        </svg>
      </div>
    </div>
  </main>

  <!-- 四、底部栏 -->
  <footer class="bottom-bar">
    <!-- 1. 泡泡键 -->
    <button class="btn-bubbles" aria-label="泡泡键">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2e1f19" stroke-width="1.7" stroke-linecap="round">
        <circle cx="8" cy="13" r="5" fill="#eef8f0"/>
        <circle cx="17" cy="7" r="2.5" fill="#eef8f0"/>
        <circle cx="16" cy="16" r="3.5" fill="#eef8f0"/>
      </svg>
    </button>

    <!-- 2. 输入框 -->
    <input type="text" class="chat-input" id="chat-input" placeholder="输入消息..." />

    <!-- 3. 功能键 -->
    <button class="btn-kaomoji" aria-label="功能键">ᗜ֊ᗜ</button>

    <!-- 4. 发送键 -->
    <button class="btn-send" id="btn-send" aria-label="发送">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2e1f19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </footer>

  <!-- 功能键展开的子页面面板 -->
  <div class="feature-panel" id="feature-panel">
    <div class="feature-panel-content">
      <div class="feature-grid">
        <div class="feature-item">
          <div class="feature-btn">
            <svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="var(--color-stroke-bubble)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.58 17.58Q10.43 17.95 10.74 18.33Q11.05 18.70 11.49 18.97Q11.93 19.25 12.92 19.65Q13.90 20.05 13.86 20.37Q13.81 20.70 13.34 21.49Q12.87 22.28 12.73 23.19Q12.58 24.09 12.64 25.35Q12.69 26.60 13.10 27.24Q13.50 27.87 14.34 28.32Q15.18 28.78 16.07 29.05Q16.95 29.33 17.77 29.39Q18.58 29.44 20.04 29.30Q21.51 29.16 22.20 28.76Q22.90 28.37 23.35 27.53Q23.79 26.70 23.84 25.09Q23.88 23.49 23.72 21.63Q23.56 19.77 23.59 18.98Q23.63 18.19 23.74 17.91Q23.85 17.63 24.63 16.90Q25.41 16.16 25.58 15.87Q25.76 15.58 25.87 15.09Q25.97 14.60 25.92 14.00Q25.86 13.40 25.94 13.14L26.02 12.88"/>
              <path d="M13.46 27.95Q12.21 28.45 11.46 28.41Q10.72 28.36 9.97 28.08Q9.23 27.80 8.11 27.09Q7.00 26.37 6.52 25.78Q6.04 25.19 5.90 24.83Q5.76 24.47 5.75 24.14Q5.74 23.81 5.89 23.31Q6.04 22.81 6.63 22.71Q7.23 22.61 7.91 22.88Q8.58 23.14 8.94 23.42Q9.29 23.71 10.40 25.01Q11.51 26.30 11.89 26.43Q12.27 26.56 12.19 26.77L12.11 26.98"/>
              <path d="M17.56 5.40Q17.95 4.19 18.49 3.45Q19.03 2.71 19.50 2.65Q19.97 2.60 20.28 2.68Q20.58 2.75 21.22 3.29Q21.86 3.83 22.81 5.04Q23.75 6.26 24.11 6.83Q24.46 7.40 24.73 8.14L25.00 8.88"/>
              <path d="M11.70 8.74Q11.54 8.47 10.66 8.07Q9.79 7.67 9.04 7.57Q8.30 7.47 7.87 7.62Q7.43 7.77 7.34 8.16Q7.25 8.56 7.27 9.05Q7.30 9.53 7.52 10.42Q7.74 11.30 7.97 11.86L8.21 12.42"/>
              <path d="M7.74 3.30Q6.95 3.41 6.33 3.87Q5.71 4.34 5.48 4.96Q5.25 5.58 5.35 5.73Q5.46 5.87 5.63 5.80L5.79 5.72"/>
              <path d="M16.07 6.28Q13.79 7.63 13.60 7.69Q13.42 7.76 13.25 7.69L13.09 7.63"/>
              <path d="M24.30 10.98Q26.35 10.35 26.51 10.08L26.67 9.81"/>
              <path d="M16.07 15.77Q15.63 14.05 15.73 13.70L15.84 13.35"/>
              <path d="M22.07 14.19Q21.71 14.04 21.56 13.74Q21.40 13.44 21.36 13.19Q21.33 12.93 21.44 12.67Q21.56 12.42 21.46 12.30L21.37 12.19"/>
              <path d="M6.63 6.14Q6.79 5.49 6.94 5.30Q7.09 5.12 7.46 4.83Q7.84 4.55 8.07 4.55L8.30 4.56"/>
              <path d="M25.56 10.65Q25.70 10.79 25.64 10.93Q25.59 11.07 25.40 10.98Q25.22 10.89 25.09 11.03Q24.96 11.16 24.88 11.00L24.81 10.84"/>
              <path d="M7.51 15.02Q8.67 15.16 8.95 14.95Q9.23 14.74 9.37 14.77L9.51 14.79"/>
            </svg>
          </div>
          <span>表情</span>
        </div>
        <div class="feature-item">
          <div class="feature-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-stroke-bubble)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <span>拍摄</span>
        </div>
        <div class="feature-item">
          <div class="feature-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-stroke-bubble)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <span>位置</span>
        </div>
        <div class="feature-item">
          <div class="feature-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-stroke-bubble)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
          </div>
          <span>语音</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 五、全屏设置面板遮罩 -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel">
      <!-- 右上角关闭按钮 -->
      <button class="btn-close-settings" id="btn-close-settings" aria-label="关闭设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-stroke-bubble)" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="settings-grid">
        <!-- 翻开的书页 - 絮语 (修正标准的翻开书本造型) -->
        <div class="setting-item" id="btn-open-dict">
          <button class="placeholder-btn" aria-label="絮语">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 6s1.5-2 5-2 5 2 5 2v14s-1.5-2-5-2-5 2-5 2V6z M12 6s1.5-2 5-2 5 2 5 2v14s-1.5-2-5-2-5 2-5 2V6z" stroke="#ffffff" stroke-width="4.5"/>
              <path d="M2 6s1.5-2 5-2 5 2 5 2v14s-1.5-2-5-2-5 2-5 2V6z M12 6s1.5-2 5-2 5 2 5 2v14s-1.5-2-5-2-5 2-5 2V6z" stroke="var(--color-stroke-bubble)" stroke-width="1.6"/>
            </svg>
          </button>
          <span>絮语</span>
        </div>
        <!-- 占位按钮 2 -->
        <div class="setting-item">
          <button class="placeholder-btn" aria-label="选项2">
            <svg width="26" height="26" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="none" stroke="#2e1f19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <!-- 占位按钮 3 -->
        <div class="setting-item">
          <button class="placeholder-btn" aria-label="选项3">
            <svg width="26" height="26" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" fill="none" stroke="#ffffff" stroke-width="5"/>
              <path d="M12 8v4l3 3" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="9" fill="none" stroke="#2e1f19" stroke-width="1.8"/>
              <path d="M12 8v4l3 3" fill="none" stroke="#2e1f19" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 六、絮语（词库管理）全屏/半全屏面板 -->
  <div class="dict-overlay" id="dict-overlay">
    <div class="dict-panel">
      <!-- 头部：图标 + 标题 + 右上角关闭按钮 -->
      <div class="dict-header">
        <div class="dict-header-left">
          <div class="dict-title-row">
            <!-- 统一标准的翻开书页图标 -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-stroke-bubble)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 6s1.5-2 5-2 5 2 5 2v14s-1.5-2-5-2-5 2-5 2V6z M12 6s1.5-2 5-2 5 2 5 2v14s-1.5-2-5-2-5 2-5 2V6z"/>
            </svg>
            <span>絮语</span>
          </div>
        </div>
        <button class="btn-dict-close" id="btn-close-dict" aria-label="关闭絮语">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-stroke-bubble)" stroke-width="2.2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- 工具栏：返回键 + 全局搜索框并列行 + 操作按键 -->
      <div class="dict-toolbar">
        <div class="dict-search-row">
          <!-- 位于全局搜索栏左侧与搜索栏并列的返回键 ＜ -->
          <button class="btn-dict-back" id="btn-back-dict" aria-label="返回上一页">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-stroke-bubble)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="dict-search-box">
            <svg class="dict-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#775c55" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="dict-search-input" id="dict-search-input" placeholder="搜索全部字卡...">
          </div>
        </div>

        <div class="dict-actions-bar">
          <div class="dict-actions-left">
            <button class="cute-btn" id="btn-add-group">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              新建分组
            </button>
          </div>
          <div class="dict-actions-right">
            <button class="cute-btn danger" id="btn-delete-selected-groups" title="批量删除勾选的分组">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              删除选中分组
            </button>
            <button class="cute-btn" id="btn-export-cards" title="导出字卡文本">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              导出字卡
            </button>
            <button class="cute-btn danger" id="btn-delete-all-groups" title="清空全部分组">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              清空
            </button>
          </div>
        </div>
      </div>

      <!-- 主体列表 (支持 Flex 弹性滚动) -->
      <div class="dict-body" id="dict-list-container">
        <!-- JS 动态渲染分组与字卡卡片 -->
      </div>
    </div>
  </div>
</div>

<!-- JS 引入 -->
<script src="js/ui.js" defer></script>
<script src="js/state.js" defer></script>
<script src="js/dict.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
